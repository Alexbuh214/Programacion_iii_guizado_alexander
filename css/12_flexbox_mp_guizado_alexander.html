<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox - Alexander Guizado</title>
    <link rel="stylesheet" href="12_flexbox_mp_guizado_alexander.css">
</head>
<body>
    <h1>Destinos con flex-direction</h1>
    <p>Autor: Alexander Guizado</p>
    <div class="destinos row">
        <div class="destino">Quito</div>
        <div class="destino">Cuenca</div>
        <div class="destino">Galápagos</div>
    </div>
    <div class="destinos row-reverse">
        <div class="destino">Quito</div>
        <div class="destino">Cuenca</div>
        <div class="destino">Galápagos</div>
    </div>
    <div class="destinos column">
        <div class="destino">Quito</div>
        <div class="destino">Cuenca</div>
        <div class="destino">Galápagos</div>
    </div>
    <div class="destinos column-reverse">
        <div class="destino">Quito</div>
        <div class="destino">Cuenca</div>
        <div class="destino">Galápagos</div>
    </div>

    <h1>Horarios con justify-content</h1>
    <div class="horarios between">
        <div class="horario">06:00</div>
        <div class="horario">12:00</div>
        <div class="horario">18:00</div>
    </div>
    <div class="horarios end">
        <div class="horario">06:00</div>
        <div class="horario">12:00</div>
        <div class="horario">18:00</div>
    </div>
    <div class="horarios center">
        <div class="horario">06:00</div>
        <div class="horario">12:00</div>
        <div class="horario">18:00</div>
    </div>
    <div class="horarios evenly">
        <div class="horario">06:00</div>
        <div class="horario">12:00</div>
        <div class="horario">18:00</div>
    </div>
    <div class="horarios around">
        <div class="horario">06:00</div>
        <div class="horario">12:00</div>
        <div class="horario">18:00</div>
    </div>
    <div class="horarios start">
        <div class="horario">06:00</div>
        <div class="horario">12:00</div>
        <div class="horario">18:00</div>
    </div>
</body>
</html>
