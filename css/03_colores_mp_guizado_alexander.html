<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colores - Alexander Guizado</title>
    <style>
        body {
            background-color: #eef4fb;
        }
        /* Color por nombre */
        h1 {
            color: navy;
        }
        /* Color hexadecimal */
        h2 {
            color: #0891b2;
        }
        /* Color rgb */
        h3 {
            color: rgb(22, 163, 74);
        }
        /* Color rgba (con transparencia) */
        h4 {
            color: rgba(220, 38, 38, 0.8);
        }
        /* Color hsl */
        h5 {
            color: hsl(35, 90%, 40%);
        }
    </style>
</head>
<body>
    <h1>Reserva de Vuelos</h1>
    <p>Autor: Alexander Guizado</p>
    <h2>Estado de los vuelos</h2>
    <h3>A tiempo</h3>
    <h4>Cancelado</h4>
    <h5>Retrasado</h5>
</body>
</html>
