<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vuelo en curso - Alexander Guizado</title>
    <link rel="stylesheet" href="19_transiciones_integracion_mp_guizado_alexander.css">
</head>
<body>
    <header>
        <h1>Vuelo en Curso</h1>
        <p>Seguimiento del vuelo AG-901 · Alexander Guizado</p>
    </header>

    <main>
        <section class="cielo" aria-label="Animación del vuelo">
            <div class="nube nube1"></div>
            <div class="nube nube2"></div>
            <div class="nube nube3"></div>

            <div class="avion">
                <span aria-hidden="true">✈</span>
                <p>AG-901</p>
            </div>

            <div class="aviso">TURBULENCIA LEVE</div>
        </section>

        <section class="controles">
            <article class="panel">
                <h2>Altitud</h2>
                <p>11 000 m</p>
            </article>
            <article class="panel">
                <h2>Velocidad</h2>
                <p>870 km/h</p>
            </article>
            <article class="panel">
                <h2>Llegada estimada</h2>
                <p>14:35</p>
            </article>
        </section>

        <section class="radar-seccion">
            <h2>Radar de la torre de control</h2>
            <div class="radar">
                <div class="pulso"></div>
            </div>
        </section>
    </main>

    <footer>
        <p>Alexander Guizado - 2026</p>
    </footer>
</body>
</html>
