<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">


    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">


    <title>Batalla Espacial Star Wars</title>


    <link rel="stylesheet" href="19_transiciones_integracion .css">
</head>
<body>


    <header>
        <h1>Batalla Espacial</h1>


        <p>
            Simulación de entrenamiento
            de la Alianza Rebelde.
        </p>
    </header>


    <main>


        <section class="escena"
                 aria-label="Escena espacial animada">


            <div class="estrella estrella1"></div>
            <div class="estrella estrella2"></div>
            <div class="estrella estrella3"></div>
            <div class="estrella estrella4"></div>
            <div class="estrella estrella5"></div>


            <div class="nave">
                <span aria-hidden="true">✈</span>
                <p>X-Wing</p>
            </div>


            <div class="alerta">
                ALERTA IMPERIAL
            </div>


        </section>


        <section class="controles">


            <h2>Centro de operaciones</h2>


            <div class="panel">


                <article class="radar-contenedor">


                    <h3>Radar Rebelde</h3>


                    <div class="radar"
                         aria-hidden="true">


                        <div class="pulso"></div>


                        <div class="centro"></div>


                    </div>


                </article>


                <article class="estado">


                    <h3>Estado de la misión</h3>


                    <p>
                        Patrulla espacial activa.
                    </p>


                    <p>
                        Nave: X-Wing
                    </p>


                    <p>
                        Base: Alianza Rebelde
                    </p>


                </article>


            </div>


        </section>


    </main>


    <footer>
        <p>Simulador Galáctico - 2026</p>
    </footer>


</body>
</html>
