<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transiciones - Alexander Guizado</title>
    <link rel="stylesheet" href="18_transiciones_mp_guizado_alexander.css">
</head>
<body>
    <main>
        <h1>Reserva de Vuelos</h1>
        <p>Autor: Alexander Guizado</p>

        <h2>Animación de despegue</h2>
        <div class="pista">
            <div class="avion">✈</div>
        </div>

        <h2>Animación de aterrizaje</h2>
        <div class="pista">
            <div class="avion2">✈</div>
        </div>

        <div class="alerta">Última llamada para abordar</div>

        <h2>Transición de color</h2>
        <p>Coloca el cursor sobre el botón</p>
        <button class="boton-reservar">Reservar vuelo</button>

        <h2>Transición con scale</h2>
        <div class="tarjeta">
            <h3>Quito - Galápagos</h3>
            <p>Desde $199</p>
        </div>

        <h2>Translate</h2>
        <div class="hangar">
            <div class="avion-hangar">AG-204</div>
        </div>

        <h2>Rotate</h2>
        <div class="brujula">
            <div class="aguja">➤</div>
        </div>

        <h2>Transformaciones combinadas</h2>
        <div class="hangar">
            <div class="avion-combo">✈</div>
        </div>
    </main>
</body>
</html>
