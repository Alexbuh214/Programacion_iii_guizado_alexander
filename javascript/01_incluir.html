<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introduccion Javascript</title>
    <script>
        alert("RUN BRO"); console.log('Hello from ');
    </script>
</head>
<body>
    <h1>Incluir javascript en doc Html</h1>
    <h2>Modo Inline</h2>
    <button onclick="alert('!RUN')">Mostrar mensaje</button>
    <input type="text" oninput="console.log(this.value)" placeholder="Escribe">
    <input type="text" oninput="console.log('Valor final guardado:', this.value)" placeholder="Alr"> 
    <input type="text" onfocus="console.log('Esta escribiendo')" onblur="alert('Warning')" placeholder="Click inside">
    <script src="01_incluir_js"></script>
</body>
</html>
