<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de lectores - Alexander Guizado</title>
</head>
<body>
    <h1>Biblioteca de Alexander Guizado</h1>
    <p>Autor: Alexander Guizado</p>
    <h2>Registro de lectores</h2>
    <form action="#" method="get">
        <p><label for="nombre">Nombre:</label><br><input type="text" id="nombre" name="nombre" placeholder="Ej.: Alex" required></p>
        <p><label for="apellido">Apellido:</label><br><input type="text" id="apellido" name="apellido" required></p>
        <p><label for="contrasena">Contraseña:</label><br><input type="password" id="contrasena" name="contrasena" required></p>
        <p><label for="edad">Edad:</label><br><input type="number" id="edad" name="edad" min="5" max="120"></p>
        <fieldset>
            <legend>Tipo de lector</legend>
            <input type="radio" id="estudiante" name="tipo_lector" value="estudiante">
            <label for="estudiante">Estudiante</label>
            <input type="radio" id="general" name="tipo_lector" value="general">
            <label for="general">Público general</label>
        </fieldset>
        <fieldset>
            <legend>Temas de interés</legend>
            <input type="checkbox" id="literatura" name="intereses" value="literatura">
            <label for="literatura">Literatura</label>
            <input type="checkbox" id="deportes" name="intereses" value="deportes">
            <label for="deportes">Deportes</label>
            <input type="checkbox" id="historia" name="intereses" value="historia">
            <label for="historia">Historia</label>
        </fieldset>
        <p>
            <label for="seccion">Sección favorita:</label><br>
            <select id="seccion" name="seccion">
                <option value="literatura">Literatura</option>
                <option value="deportes">Deportes</option>
                <option value="historia">Historia</option>
            </select>
        </p>
        <button type="submit">Registrarme</button>
        <button type="reset">Limpiar</button>
    </form>
</body>
</html>
